<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    :root { color-scheme: dark; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }
    body { display: grid; place-items: center; }
    body[data-model-state="error"] #loading-dot { background: #b87555; }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      cursor: pointer;
      touch-action: none;
    }
    #loading-dot {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 7px;
      height: 7px;
      margin: -3.5px;
      border-radius: 50%;
      background: #D4923A;
      opacity: .7;
      transition: opacity .2s ease;
      pointer-events: none;
    }
    body.ready #loading-dot { opacity: 0; }
  </style>
</head>
<body>
  <canvas id="macbook-canvas" role="button" tabindex="0" aria-label="Close MacBook lid" aria-pressed="false"></canvas>
  <div id="loading-dot" aria-hidden="true"></div>
  <script src="remote-macbook-three.min.js"></script>
  <script src="remote-macbook-gltfloader.js"></script>
  <script>
    (() => {
      const canvas = document.getElementById('macbook-canvas');
      const body = document.body;
      const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');

      let reducedMotion = reducedMotionQuery.matches;
      let modelLoaded = false;
      let modelState = 'loading';
      let lidPivot = null;
      let lidProgress = 0;
      let lidAnimation = null;
      let introStart = 0;
      let mouseNX = 0;
      let mouseNY = 0;
      let tiltX = 0;
      let tiltY = 0;
      let elapsed = 0;

      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setClearColor(0x000000, 0);
      renderer.outputEncoding = THREE.sRGBEncoding;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(34, 1, 0.01, 100);
      camera.position.set(0, 0.48, 3.05);
      camera.lookAt(0, 0.18, 0);

      scene.add(new THREE.AmbientLight(0xffffff, 0.62));
      const keyLight = new THREE.DirectionalLight(0xfff4df, 1.15);
      keyLight.position.set(2.5, 4, 4);
      scene.add(keyLight);
      const amberLight = new THREE.PointLight(0xD4923A, 0.75, 2.8);
      amberLight.position.set(0, 0.2, 0.8);
      scene.add(amberLight);

      const masterGroup = new THREE.Group();
      scene.add(masterGroup);

      const clickIndicator = new THREE.Group();
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.06, 0.075, 32),
        new THREE.MeshBasicMaterial({ color: 0xD4923A, transparent: true, opacity: 0, side: THREE.DoubleSide })
      );
      ring.rotation.x = -Math.PI / 2;
      const dot = new THREE.Mesh(
        new THREE.CircleGeometry(0.025, 24),
        new THREE.MeshBasicMaterial({ color: 0xD4923A, transparent: true, opacity: 0, side: THREE.DoubleSide })
      );
      dot.rotation.x = -Math.PI / 2;
      clickIndicator.add(ring, dot);
      clickIndicator.visible = false;
      masterGroup.add(clickIndicator);

      const LID_CLOSE_ANGLE = 2.0 - 0.052;
      const LID_CLOSE_Z_OFFSET = 0.06;
      let pivotY = 0;
      let pivotZ = 0;
      let introReady = false;

      function applyLidPose(progress) {
        if (!lidPivot) return;
        lidPivot.rotation.x = LID_CLOSE_ANGLE * progress;
        lidPivot.position.y = pivotY;
        lidPivot.position.z = pivotZ + LID_CLOSE_Z_OFFSET * progress;
      }

      function ease(value) {
        return value < 0.5
          ? 4 * value * value * value
          : 1 - Math.pow(-2 * value + 2, 3) / 2;
      }

      function setClosedIndicator(isVisible) {
        clickIndicator.visible = isVisible;
        canvas.setAttribute('aria-label', isVisible ? 'Open MacBook lid' : 'Close MacBook lid');
        canvas.setAttribute('aria-pressed', String(isVisible));
        if (!isVisible) {
          ring.material.opacity = 0;
          dot.material.opacity = 0;
        }
      }
      setClosedIndicator(false);

      function toggleLid() {
        if (!modelLoaded || !lidPivot) return;
        const target = lidProgress < 0.5 ? 1 : 0;
        setClosedIndicator(false);
        if (reducedMotion) {
          lidProgress = target;
          lidAnimation = null;
          applyLidPose(lidProgress);
          setClosedIndicator(target === 1);
          return;
        }
        lidAnimation = { from: lidProgress, to: target, startedAt: performance.now() };
      }

      function setReducedMotion(value) {
        reducedMotion = Boolean(value);
        if (reducedMotion) {
          mouseNX = 0;
          mouseNY = 0;
          tiltX = 0;
          tiltY = 0;
          masterGroup.position.y = 0;
          masterGroup.rotation.set(0, 0, 0);
          if (lidAnimation) {
            lidProgress = lidAnimation.to;
            lidAnimation = null;
            applyLidPose(lidProgress);
            setClosedIndicator(lidProgress === 1);
          }
        }
      }
      window.remoteMacBookSetReducedMotion = setReducedMotion;
      reducedMotionQuery.addEventListener?.('change', event => setReducedMotion(event.matches));

      function updatePointer(clientX, clientY) {
        if (reducedMotion) return;
        const rect = canvas.getBoundingClientRect();
        mouseNX = ((clientX - rect.left) / Math.max(rect.width, 1)) * 2 - 1;
        mouseNY = ((clientY - rect.top) / Math.max(rect.height, 1)) * 2 - 1;
      }

      canvas.addEventListener('pointermove', event => updatePointer(event.clientX, event.clientY));
      canvas.addEventListener('pointerleave', () => { mouseNX = 0; mouseNY = 0; });
      canvas.addEventListener('pointerdown', event => {
        if (event.button !== 0) return;
        event.preventDefault();
        toggleLid();
      });
      canvas.addEventListener('keydown', event => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        event.preventDefault();
        toggleLid();
      });

      new THREE.GLTFLoader().load(
        'remote-macbook.glb',
        gltf => {
          const model = gltf.scene;
          const initialBounds = new THREE.Box3().setFromObject(model);
          const initialSize = initialBounds.getSize(new THREE.Vector3());
          const scale = 1.75 / Math.max(initialSize.x, initialSize.y, initialSize.z);
          model.scale.setScalar(scale);
          const scaledBounds = new THREE.Box3().setFromObject(model);
          model.position.sub(scaledBounds.getCenter(new THREE.Vector3()));
          model.position.y += 0.42;
          model.updateMatrixWorld(true);

          let lidNode = null;
          let bodyNode = null;
          model.traverse(node => {
            if (!lidNode && node.name?.includes('VCQqxpxkUlzqcJI')) lidNode = node;
            if (!bodyNode && node.name?.includes('BoBvWqDHZjAeVrp')) bodyNode = node;
          });

          if (lidNode && bodyNode) {
            const bodyBounds = new THREE.Box3().setFromObject(bodyNode);
            const hinge = new THREE.Vector3(
              (bodyBounds.min.x + bodyBounds.max.x) / 2,
              bodyBounds.max.y,
              bodyBounds.min.z
            );
            lidPivot = new THREE.Group();
            lidPivot.position.copy(model.worldToLocal(hinge.clone()));
            pivotY = lidPivot.position.y;
            pivotZ = lidPivot.position.z;
            model.add(lidPivot);
            model.updateMatrixWorld(true);
            lidPivot.attach(lidNode);
            applyLidPose(0);
            clickIndicator.position.set(0, bodyBounds.max.y + 0.08, bodyBounds.max.z + 0.15);
          }

          masterGroup.add(model);
          modelLoaded = true;
          modelState = lidPivot ? 'loaded' : 'missing-hinge';
          body.dataset.modelState = modelState;
          body.classList.add('ready');
          introStart = performance.now();
          introReady = true;
        },
        undefined,
        () => {
          modelState = 'error';
          body.dataset.modelState = modelState;
          body.classList.add('ready');
        }
      );

      function resize() {
        const width = Math.max(canvas.clientWidth, 1);
        const height = Math.max(canvas.clientHeight, 1);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height, false);
      }
      new ResizeObserver(resize).observe(canvas);
      window.addEventListener('resize', resize);
      resize();

      const clock = new THREE.Clock();
      function render() {
        requestAnimationFrame(render);
        const delta = clock.getDelta();
        elapsed += delta;

        if (introReady && !reducedMotion) {
          const progress = Math.min((performance.now() - introStart) / 800, 1);
          const eased = ease(progress);
          masterGroup.position.y = -0.18 * (1 - eased);
          masterGroup.rotation.y = 0.16 * (1 - eased);
          if (progress >= 1) introReady = false;
        } else if (reducedMotion) {
          masterGroup.position.y = 0;
          masterGroup.rotation.set(0, 0, 0);
          introReady = false;
        }

        if (lidAnimation) {
          const duration = reducedMotion ? 0 : 900;
          const progress = duration === 0 ? 1 : Math.min((performance.now() - lidAnimation.startedAt) / duration, 1);
          lidProgress = lidAnimation.from + (lidAnimation.to - lidAnimation.from) * ease(progress);
          applyLidPose(lidProgress);
          if (progress >= 1) {
            const closed = lidAnimation.to === 1;
            lidProgress = lidAnimation.to;
            lidAnimation = null;
            setClosedIndicator(closed);
          }
        }

        if (!reducedMotion && !introReady) {
          masterGroup.position.y = Math.sin(elapsed * 1.2) * 0.006;
          tiltY += (mouseNX * 0.075 - tiltY) * 0.08;
          tiltX += (-mouseNY * 0.055 - tiltX) * 0.08;
          masterGroup.rotation.y = tiltY;
          masterGroup.rotation.x = tiltX;
        }

        if (clickIndicator.visible) {
          const pulse = 0.5 + 0.5 * Math.sin(elapsed * 3);
          ring.material.opacity = 0.25 + pulse * 0.35;
          dot.material.opacity = 0.4 + pulse * 0.4;
          const scale = 1 + pulse * 0.15;
          ring.scale.set(scale, scale, scale);
        }

        renderer.render(scene, camera);
      }
      render();
    })();
  </script>
</body>
</html>
